name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Destination to publish (use a specific target to recover a partial release)"
        required: true
        default: all
        type: choice
        options:
          - all
          - fabric-modrinth
          - fabric-curseforge
          - neoforge-modrinth
          - neoforge-curseforge
          - github

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  MINECRAFT_VERSION: "1.21.1"
  MODRINTH_PROJECT_ID: "4UKlJSdk"
  CURSEFORGE_PROJECT_ID: "958325"
  RELEASE_ARTIFACT: "playerex-release-jars"

jobs:
  build:
    name: Build and validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Read and validate version
        id: meta
        run: python3 scripts/release.py

      - name: Build release artifacts
        run: ./gradlew clean build --stacktrace --warning-mode all

      - name: Stage and verify release files
        run: python3 scripts/release.py --stage

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  fabric-modrinth:
    name: Fabric → Modrinth
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'fabric-modrinth'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release jars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: build/release

      - name: Validate Modrinth token
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: '[[ -n "$MODRINTH_TOKEN" ]] || { echo "Missing MODRINTH_TOKEN Actions secret (repository or organization)." >&2; exit 1; }'

      - name: Publish Fabric to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/release/*-fabric-1.21.1.jar
          name: ${{ needs.build.outputs.version }}+${{ env.MINECRAFT_VERSION }}-fabric
          version: ${{ needs.build.outputs.version }}+${{ env.MINECRAFT_VERSION }}-fabric
          version-type: release
          changelog-file: build/release/RELEASE-NOTES.md
          loaders: fabric
          environment: client | server
          game-versions: ${{ env.MINECRAFT_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}
            fabric-language-kotlin(required){modrinth:fabric-language-kotlin}{curseforge:fabric-language-kotlin}
            data_attributes(required){modrinth:KCGxOJsE}{curseforge:955929}
            fzzy_config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
            remnant(embedded){modrinth:oLPaySSb}{curseforge:1019391}
            ranged_weapon_api(optional){modrinth:AqaIIO6D}{curseforge:ranged-weapon-api}
            more_rpg_classes(optional){modrinth:Wkc3lwHo}{curseforge:more-rpg-library}
            spell_power(optional){modrinth:8ooWzSQP}{curseforge:spell-power}
            spell_engine(optional){modrinth:XvoWJaA2}{curseforge:spell-engine}
            manaattributes(optional){modrinth:1uXUV3Qn}{curseforge:mana-attributes}
            trinkets(optional){modrinth:5aaWibi9}{curseforge:trinkets}
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 3
          fail-mode: fail

  fabric-curseforge:
    name: Fabric → CurseForge
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'fabric-curseforge'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release jars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: build/release

      - name: Validate CurseForge token
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: '[[ -n "$CURSEFORGE_TOKEN" ]] || { echo "Missing CURSEFORGE_TOKEN Actions secret (repository or organization)." >&2; exit 1; }'

      - name: Publish Fabric to CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/release/*-fabric-1.21.1.jar
          name: ${{ needs.build.outputs.version }}+${{ env.MINECRAFT_VERSION }}-fabric
          version: ${{ needs.build.outputs.version }}+${{ env.MINECRAFT_VERSION }}-fabric
          version-type: release
          changelog-file: build/release/RELEASE-NOTES.md
          loaders: fabric
          environment: client | server
          game-versions: ${{ env.MINECRAFT_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}
            fabric-language-kotlin(required){modrinth:fabric-language-kotlin}{curseforge:fabric-language-kotlin}
            data_attributes(required){modrinth:KCGxOJsE}{curseforge:955929}
            fzzy_config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
            remnant(embedded){modrinth:oLPaySSb}{curseforge:1019391}
            ranged_weapon_api(optional){modrinth:AqaIIO6D}{curseforge:ranged-weapon-api}
            more_rpg_classes(optional){modrinth:Wkc3lwHo}{curseforge:more-rpg-library}
            spell_power(optional){modrinth:8ooWzSQP}{curseforge:spell-power}
            spell_engine(optional){modrinth:XvoWJaA2}{curseforge:spell-engine}
            manaattributes(optional){modrinth:1uXUV3Qn}{curseforge:mana-attributes}
            trinkets(optional){modrinth:5aaWibi9}{curseforge:trinkets}
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 3
          fail-mode: fail

  neoforge-modrinth:
    name: NeoForge → Modrinth
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'neoforge-modrinth'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release jars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: build/release

      - name: Validate Modrinth token
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: '[[ -n "$MODRINTH_TOKEN" ]] || { echo "Missing MODRINTH_TOKEN Actions secret (repository or organization)." >&2; exit 1; }'

      - name: Publish NeoForge to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/release/*-neoforge-1.21.1.jar
          name: ${{ needs.build.outputs.version }}+${{ env.MINECRAFT_VERSION }}-neoforge
          version: ${{ needs.build.outputs.version }}+${{ env.MINECRAFT_VERSION }}-neoforge
          version-type: release
          changelog-file: build/release/RELEASE-NOTES.md
          loaders: neoforge
          environment: client | server
          game-versions: ${{ env.MINECRAFT_VERSION }}
          dependencies: |
            kotlinforforge(required){modrinth:kotlin-for-forge}{curseforge:kotlin-for-forge}
            data_attributes(required){modrinth:KCGxOJsE}{curseforge:955929}
            fzzy_config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
            remnant(embedded){modrinth:oLPaySSb}{curseforge:1019391}
            ranged_weapon_api(optional){modrinth:AqaIIO6D}{curseforge:ranged-weapon-api}
            more_rpg_classes(optional){modrinth:Wkc3lwHo}{curseforge:more-rpg-library}
            spell_power(optional){modrinth:8ooWzSQP}{curseforge:spell-power}
            spell_engine(optional){modrinth:XvoWJaA2}{curseforge:spell-engine}
            curios(optional){modrinth:vvuO3ImH}{curseforge:curios}
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 3
          fail-mode: fail

  neoforge-curseforge:
    name: NeoForge → CurseForge
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'neoforge-curseforge'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release jars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: build/release

      - name: Validate CurseForge token
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: '[[ -n "$CURSEFORGE_TOKEN" ]] || { echo "Missing CURSEFORGE_TOKEN Actions secret (repository or organization)." >&2; exit 1; }'

      - name: Publish NeoForge to CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/release/*-neoforge-1.21.1.jar
          name: ${{ needs.build.outputs.version }}+${{ env.MINECRAFT_VERSION }}-neoforge
          version: ${{ needs.build.outputs.version }}+${{ env.MINECRAFT_VERSION }}-neoforge
          version-type: release
          changelog-file: build/release/RELEASE-NOTES.md
          loaders: neoforge
          environment: client | server
          game-versions: ${{ env.MINECRAFT_VERSION }}
          dependencies: |
            kotlinforforge(required){modrinth:kotlin-for-forge}{curseforge:kotlin-for-forge}
            data_attributes(required){modrinth:KCGxOJsE}{curseforge:955929}
            fzzy_config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
            remnant(embedded){modrinth:oLPaySSb}{curseforge:1019391}
            ranged_weapon_api(optional){modrinth:AqaIIO6D}{curseforge:ranged-weapon-api}
            more_rpg_classes(optional){modrinth:Wkc3lwHo}{curseforge:more-rpg-library}
            spell_power(optional){modrinth:8ooWzSQP}{curseforge:spell-power}
            spell_engine(optional){modrinth:XvoWJaA2}{curseforge:spell-engine}
            curios(optional){modrinth:vvuO3ImH}{curseforge:curios}
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 3
          fail-mode: fail

  github-release:
    name: GitHub release
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'github'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release jars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: build/release

      - name: Publish GitHub release
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.build.outputs.tag }}
          github-commitish: ${{ github.sha }}
          github-prerelease: false
          files: |
            build/release/*-fabric-1.21.1.jar
            build/release/*-neoforge-1.21.1.jar
          name: PlayerEx ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: release
          changelog-file: build/release/RELEASE-NOTES.md
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 3
          fail-mode: fail
